<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#E9E8E8">
  <title>Desktop & mobile mockups · Remarkable 2027</title>
  <!-- MOCKUP_STYLES -->
</head>
<body>
  <header class="mockup-toolbar">
    <div class="toolbar-main">
      <div class="mockup-title"><h1>Remarkable <span>2027</span></h1><p>Design mockups</p></div>
      <div class="mode-toggle" role="group" aria-label="View mode">
        <button data-mode="desktop" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>Desktop</button>
        <button data-mode="mobile" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg>Mobile</button>
      </div>
      <nav class="page-tabs" aria-label="Choose a mockup page">
        <button data-page="index" aria-pressed="true">Home</button>
        <button data-page="agenda" aria-pressed="false">Agenda</button>
        <button data-page="speakers" aria-pressed="false">Speakers</button>
        <button data-page="faq" aria-pressed="false">FAQ</button>
      </nav>
    </div>
    <div class="toolbar-options">
      <p>Scroll inside the preview to explore.</p>
      <div class="view-options">
        <label for="section-jump">Section<select id="section-jump" aria-label="Section"><option value="">Opening</option></select></label>
        <label for="preview-width">Width<select id="preview-width" aria-label="Preview width"><option value="1440">1440 px</option></select></label>
      </div>
    </div>
  </header>
  <main class="preview-stage" aria-label="Mockup preview">
    <div class="preview-canvas"><div class="preview-device"><iframe id="event-preview" title="Remarkable 2027 desktop Home"></iframe></div></div>
  </main>
  <footer class="preview-caption"><p id="view-caption">Home · Desktop</p><p id="dimension-caption">1440 px</p></footer>
  <p id="view-status" class="sr-only" role="status">Home desktop mockup selected.</p>
  <!-- MOCKUP_DATA -->
  <!-- MOCKUP_SCRIPT -->
</body>
</html>
