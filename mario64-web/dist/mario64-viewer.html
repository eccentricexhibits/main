<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario Animation Viewer</title>
<style>
:root {
  --bg: #0f1420;
  --card: #182033;
  --ink: #f3f5fa;
  --muted: #a9b3c7;
  --accent: #e8483b;
  --accent-ink: #fff;
  --line: #2a3550;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
[hidden] { display: none !important; }

.gate {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at top, #24304d 0%, var(--bg) 70%);
  z-index: 10;
}
.gate.drag .gate-card { outline: 3px dashed var(--accent); }
.gate-card {
  max-width: 460px; width: 100%; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.gate-card h1 { margin: 0 0 8px; font-size: 1.6rem; }
.gate-card p { color: var(--muted); line-height: 1.5; }
.btn, button {
  display: inline-block; cursor: pointer; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
  padding: 10px 18px;
}
button { padding: 6px 12px; background: #2b3858; }
button:hover, .btn:hover { filter: brightness(1.1); }
.error { color: #ff8a80 !important; min-height: 1.5em; }
.small { font-size: .85rem; color: var(--muted); }
a { color: #8fb8ff; }

.panel {
  position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px));
  background: rgba(24, 32, 51, .92); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; display: grid; gap: 8px; font-size: .9rem; z-index: 5;
}
.panel label { display: grid; gap: 4px; }
.panel label:has(input[type=checkbox]) { display: flex; align-items: center; gap: 6px; }
.panel select, .panel input[type=range] { width: 100%; }
.panel select { background: #0f1420; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
.row { display: flex; gap: 6px; }
.row button { flex: 1; }

.hud {
  position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between;
  align-items: flex-start; pointer-events: none; z-index: 5;
  font-weight: 800; font-size: 1.4rem; text-shadow: 0 2px 0 #000, 0 0 6px rgba(0,0,0,.6);
}
.hud .right { text-align: right; }
.hud .small { font-weight: 500; text-shadow: 0 1px 2px #000; color: #e6ebf5; }
.help {
  position: fixed; bottom: 12px; left: 12px; max-width: calc(100vw - 24px);
  background: rgba(15, 20, 32, .8); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-size: .8rem; color: var(--muted); z-index: 5; line-height: 1.6;
}
.help kbd {
  background: #2b3858; color: var(--ink); border-radius: 4px; padding: 0 5px; font: inherit; font-size: .75rem;
}
.toast {
  position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 6;
  font-size: 2rem; font-weight: 900; text-shadow: 0 3px 0 #000; pointer-events: none;
}
.touch { position: fixed; inset: auto 0 0 0; height: 45vh; z-index: 4; pointer-events: none; }
.touch .stick, .touch .tbtn { pointer-events: auto; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); }
.touch .stick { left: 24px; bottom: 24px; width: 140px; height: 140px; }
.touch .knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.45); }
.touch .tbtn { width: 64px; height: 64px; display: grid; place-items: center; font-weight: 800; color: #fff; user-select: none; -webkit-user-select: none; }
.power {
  width: 44px; height: 44px; border-radius: 50%; margin-top: 6px;
  border: 3px solid #fff; box-shadow: 0 2px 0 #000;
}
</style>
</head>
<body class="viewer">
<canvas id="view"></canvas>
<div id="romGate" class="gate">
  <div class="gate-card">
    <h1>Animation viewer</h1>
    <p>Choose your own <b>Super Mario 64 (US)</b> ROM. It is read locally in your browser and never uploaded.</p>
    <label class="btn">Choose ROM…<input id="romFile" type="file" accept=".z64,.n64,.v64,.rom,.bin" hidden></label>
    <p id="romError" class="error"></p>
  </div>
</div>
<div id="panel" class="panel" hidden>
  <label>Animation <select id="animSelect"></select></label>
  <div class="row">
    <button id="prevAnim" type="button">◀</button>
    <button id="playPause" type="button">Pause</button>
    <button id="nextAnim" type="button">▶</button>
  </div>
  <label>Frame <input id="frameSlider" type="range" min="0" max="1" value="0"></label>
  <div id="animInfo" class="small"></div>
  <label>Eyes <select id="eyeSelect"><option value="0">Blink</option><option value="1">Open</option><option value="2">Half</option><option value="3">Closed</option><option value="8">Dead</option></select></label>
  <label>Hands <select id="handSelect"><option value="0">Fists</option><option value="1">Open</option><option value="2">Peace</option><option value="3">Holding cap</option></select></label>
  <label><input id="capToggle" type="checkbox" checked> Cap on</label>
  <p class="small"><a href="mario64-playground.html">← Back to the game</a></p>
</div>
