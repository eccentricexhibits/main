<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email banner — Remarkable 2027 — Concept C</title>
  <link rel="stylesheet" href="../../brand/tokens.css">
  <style>
    /* Concept C banner: white, colour logo, bold black headline on the left with a gradient underline,
       large dashed anniversary square, magenta pixel pattern cropped by the right edge. */
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1478px; height: 300px; overflow: hidden; }
    body { position: relative; background: var(--vi-white); color: var(--vi-black); font-family: var(--font-body); }
    .logo { position: absolute; left: 48px; top: 32px; height: 44px; width: auto; }
    .text { position: absolute; left: 48px; bottom: 40px; }
    .headline { display: inline-block; font: 500 92px/0.95 var(--font-heading); letter-spacing: -0.02em; white-space: nowrap; padding-bottom: 14px;
      background: var(--vi-gradient) no-repeat left bottom / 100% 6px; }
    .sub { margin-top: 16px; font: 700 28px/1.2 var(--font-body); white-space: nowrap; }
    .anniv { position: absolute; left: 1010px; top: 66px; width: 168px; height: 168px; border: 2px dashed #555; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; }
    .anniv span { font: 400 11px/1 var(--font-body); color: #555; padding-bottom: 10px; }
    .pixels { position: absolute; right: -46px; top: 40px; width: 230px; height: auto; }
  </style>
</head>
<body>
  <img class="logo" src="../../assets/logos/logo-bilingual-colour.png" alt="Vector Institute | Institut Vecteur">
  <div class="text">
    <h1 class="headline" data-copy="banner.headline"></h1>
    <p class="sub" data-copy="banner.subline"></p>
  </div>
  <div class="anniv" role="img" data-copy-label="hero.anniversary_slot"><span>10th anniversary mark</span></div>
  <img class="pixels" src="../../assets/brand-elements/pixel-pattern-magenta.svg" alt="">
  <script src="../shared/banner.js" type="module"></script>
</body>
</html>
