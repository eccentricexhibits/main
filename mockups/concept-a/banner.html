<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email banner — Remarkable 2027 — Concept A</title>
  <link rel="stylesheet" href="../../brand/tokens.css">
  <style>
    /* Concept A banner: closest to the 2026 banners. Gradient, white knockout logo top-left, letter-spaced wordmark
       and dates centred, faint AI letterform behind, plus-pattern clusters in two corners. */
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1478px; height: 300px; overflow: hidden; }
    body { position: relative; background: var(--vi-gradient); color: var(--vi-white); font-family: var(--font-body); }
    .ai { position: absolute; left: 50%; top: 50%; width: 900px; aspect-ratio: 2500 / 1406; transform: translate(-44%, -50%);
      background: url("../../assets/brand-elements/ai-letterform-2026.png") no-repeat center / contain; filter: brightness(0) invert(1); opacity: 0.12; }
    .plus { --s: 0.3; position: absolute; filter: brightness(0) invert(1); opacity: 0.4;
      background: url("../../assets/brand-elements/plus-pattern-2026.png") no-repeat; background-size: calc(2500px * var(--s)) auto; }
    .plus--bl { left: 0; bottom: 6px; width: calc(1072px * var(--s)); height: calc(409px * var(--s)); background-position: 0 calc(-554px * var(--s)); }
    .plus--tr { --s: 0.2; right: 0; top: 4px; /* small enough to stay clear of the anniversary disc */ width: calc(1072px * var(--s)); height: calc(432px * var(--s)); background-position: calc(-1428px * var(--s)) calc(-538px * var(--s)); }
    .logo { position: absolute; left: 40px; top: 30px; height: 46px; width: auto; }
    .lockup { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 56px; padding-top: 14px; }
    .text { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .wordmark { font: 400 58px/1 var(--font-heading); text-transform: uppercase; letter-spacing: 0.5em; margin-right: -0.5em; white-space: nowrap; }
    .wordmark span { font-weight: 500; }
    .sub { font: 600 28px/1.2 var(--font-body); white-space: nowrap; }
    /* the agency's full-colour 10th-anniversary mark on a white disc, as in the Concept A hero */
    .anniv { flex: none; width: 176px; height: 176px; border-radius: 50%; background: var(--vi-white); display: grid; place-items: center; }
    .anniv img { width: 60%; height: auto; transform: translateY(-2%); }
  </style>
</head>
<body>
  <div class="ai" aria-hidden="true"></div>
  <div class="plus plus--bl" aria-hidden="true"></div>
  <div class="plus plus--tr" aria-hidden="true"></div>
  <img class="logo" src="../../assets/logos/logo-bilingual-knockout-white.png" alt="Vector Institute | Institut Vecteur">
  <div class="lockup">
    <div class="text">
      <h1 class="wordmark" data-copy-label="banner.headline"><span aria-hidden="true" data-copy="banner.headline" data-part="name"></span>&nbsp;&nbsp;<span aria-hidden="true" data-copy="banner.headline" data-part="year"></span></h1>
      <p class="sub" data-copy="banner.subline"></p>
    </div>
    <div class="anniv"><img src="../../assets/logos/anniversary-10-years-colour.png" alt="Vector Institute 10th anniversary mark: 10 Years | Ans" width="620" height="646"></div>
  </div>
  <script src="../shared/banner.js" type="module"></script>
</body>
</html>
