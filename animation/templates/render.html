<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Official Arrow Field — 6878 × 1080 render surface</title>
<style>
  /* The speaker cards are set in Karbon, so the export surface needs it inlined
     too — not just the review page. */
  @font-face {
    font-family: 'Karbon';
    font-weight: 600;
    font-style: normal;
    src: url('__KARBON_SEMIBOLD__') format('opentype');
  }

  html, body { margin: 0; padding: 0; background: #000; }
  #stage {
    position: relative;
    width: 6878px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #13071A 0%, #3B1056 100%);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* __ENGINE__ */
/*
 * ?layer=N isolates a single layer at full opacity — used for angle checks.
 * ?bare=1  mounts the background and grain with no arrows — the plate that
 *          analyze.py measures ink coverage against.
 */
var params = new URLSearchParams(location.search);
var only = params.get('layer');
var config = CONFIG;
/*
 * ?alpha=<bottom opacity> exports over transparency: the ground keeps its
 * colours but ramps from fully transparent at the top to that opacity at the
 * bottom, and the page itself stops painting so the screenshot can carry alpha.
 */
var alpha = params.get('alpha');
if (alpha !== null) {
  config = Object.assign({}, config, {
    alphaGround: { top: 0, bottom: alpha === '' ? 0.5 : Number(alpha) },
  });
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';
}
if (params.get('bare')) {
  config = Object.assign({}, config, { layers: [] });
} else if (only) {
  config = Object.assign({}, config, {
    layers: [Object.assign({}, CONFIG.layers[Number(only) - 1], { opacity: 1 })],
  });
}
/*
 * ?ambient=0 drops the drifting tile layers but keeps the logo event, so the
 * formation can be exported as its own layer. ?bare=1 empties the layers too,
 * but takes the transition with it — the transition only mounts when there are
 * layers — so it is no use for this.
 */
if (params.get('ambient') === '0') {
  config = Object.assign({}, config, { layers: [], keepTransition: true });
}
/*
 * ?event=0 is the mirror image: the drifting field with no logo event. The
 * transition has to be skipped at the mount rather than hidden afterwards,
 * because mounting it also fades the ambient field out for the 33 s the event
 * owns — which would leave a hole in an ambient-only export.
 */
if (params.get('event') === '0') {
  config = Object.assign({}, config, { event: false });
}
// ?speakers=0 mounts the logo event without the speaker cards.
if (params.get('speakers') === '0') {
  config = Object.assign({}, config, {
    transition: Object.assign({}, config.transition, { speakers: false }),
  });
}
var stage = document.getElementById('stage');
var field = mountArrowField(stage, config);
window.metrics = field.metrics;
window.transition = field.transition
  ? { times: field.transition.times, particles: field.transition.particles,
      markPoints: field.transition.markPoints }
  : null;

/*
 * Frame-accurate seeking for offline capture: window.seek(seconds).
 * The CSS layers seek through the Web Animations API; the particle canvas is a
 * pure function of t, so it just gets redrawn at the same instant.
 */
window.seek = function (t) {
  stage.getAnimations({ subtree: true }).forEach(function (a) {
    a.pause();
    a.currentTime = t * 1000;
  });
  if (field.transition) field.transition.draw(t % config.duration);
};
window.play = function () {
  stage.getAnimations({ subtree: true }).forEach(function (a) { a.play(); });
  if (field.transition) requestAnimationFrame(function tick() {
    var a = stage.getAnimations({ subtree: true })[0];
    if (a && a.playState === 'running') {
      field.transition.draw((Number(a.currentTime) / 1000) % config.duration);
      requestAnimationFrame(tick);
    }
  });
};
window.seek(0);
</script>
</body>
</html>
