<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Bovina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Permanent+Marker&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #f6f7f0;
    --ink-soft: rgba(246, 247, 240, 0.78);
    --tag-paper: #fbfbf7;
    --tag-ink: #1b1b1b;
    --tag-red: #c21f2b;
    --stripe-blue: #2a2fb0;
    --bar: rgba(16, 38, 36, 0.62);
    --bar-line: rgba(246, 247, 240, 0.18);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #2f8f86 radial-gradient(ellipse 80% 70% at 38% 42%, #d2dc4c 0%, #8cc35c 32%, #3e9d7f 62%, #1d4d48 100%);
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .badge {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    display: grid;
    background: var(--tag-paper);
    color: var(--tag-ink);
    border: 3px solid var(--tag-ink);
    border-radius: 7px;
    overflow: hidden;
    transform: rotate(-3deg);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    pointer-events: none;
  }
  .badge small {
    background: var(--tag-red);
    color: var(--tag-paper);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px 4px;
  }
  .badge strong {
    font-family: "Permanent Marker", "Comic Sans MS", cursive;
    font-weight: 400;
    font-size: clamp(26px, 6vw, 36px);
    color: var(--tag-red);
    padding: 2px 16px 6px;
    line-height: 1.1;
  }

  .bar {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(560px, calc(100% - 32px));
    box-sizing: border-box;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 8px 8px 8px 16px;
    background: var(--bar);
    border: 1px solid var(--bar-line);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .hint { flex: 1 1 180px; font-size: 13px; color: var(--ink-soft); }
  .buttons { display: flex; gap: 6px; }
  button {
    font: 700 13px/1 "Archivo", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--bar-line);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button:hover { background: rgba(246, 247, 240, 0.1); }
  button[aria-pressed="true"] { background: var(--stripe-blue); border-color: var(--stripe-blue); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    pointer-events: none;
  }
  #status[hidden] { display: none; }
  @media (max-width: 440px) {
    .bar { border-radius: 18px; }
  }
</style>

<div id="stage"></div>
<div class="badge" aria-label="Hello my name is Bovina"><small>Hello my name is</small><strong>Bovina</strong></div>
<p id="status">Building Bovina…</p>
<div class="bar">
  <span class="hint">Drag to turn her. Scroll or pinch to zoom.</span>
  <div class="buttons">
    <button id="spin" type="button" aria-pressed="true">Auto-rotate</button>
    <button id="reset" type="button">Reset view</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { createBovina } from './bovina.js';

  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.45;

  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
  const home = { pos: new THREE.Vector3(0.3, 1.2, 3.9), target: new THREE.Vector3(0, 0.96, 0) };

  scene.add(new THREE.HemisphereLight(0xfffbe8, 0x3f7a5a, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.1);
  key.position.set(-2, 3.2, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2.4, bottom: -0.4 });
  key.shadow.bias = -0.0004;
  key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xd8f0ff, 1.3);
  rim.position.set(2.2, 2, -3);
  scene.add(rim);

  const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.ShadowMaterial({ opacity: 0.28 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 0.8;
  controls.maxDistance = 9;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.autoRotateSpeed = 1.2;

  function resetView() {
    camera.position.copy(home.pos);
    controls.target.copy(home.target);
    controls.update();
  }
  resetView();

  const spin = document.getElementById('spin');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setSpin(on) {
    controls.autoRotate = on;
    spin.setAttribute('aria-pressed', String(on));
  }
  setSpin(!reduceMotion);
  spin.addEventListener('click', () => setSpin(!controls.autoRotate));
  document.getElementById('reset').addEventListener('click', resetView);

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Keep the whole figure in frame on tall phone screens.
    camera.fov = w / h < 0.75 ? 44 : 32;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // Texture baking blocks for a moment, so let the status paint first.
  requestAnimationFrame(() => setTimeout(() => {
    scene.add(createBovina());
    document.getElementById('status').hidden = true;
  }, 30));

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
