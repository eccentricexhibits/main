<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vector — Convergence · 3-wall preview</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #15151c;
    --line: #2a2a36;
    --text: #e9e8e8;
    --dim: #8b8b99;
    --magenta: #EB088A;
    --cobalt: #313CFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Open Sans", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .meta { color: var(--dim); font-size: 12.5px; }
  header .meta b { color: var(--text); font-weight: 600; }

  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; }
  #wrap { position: relative; width: 100%; max-width: 100%; }
  canvas { display: block; width: 100%; height: auto; background: #000; border-radius: 2px; }

  /* Wall labels drawn in DOM so they stay legible at any zoom */
  #walls { position: absolute; inset: 0; pointer-events: none; }
  #walls div {
    position: absolute; top: 0; bottom: 0;
    border-left: 1px solid rgba(255,255,255,.35);
    border-right: 1px solid rgba(255,255,255,.35);
    font-size: 11px; color: rgba(255,255,255,.75);
    padding: 4px 6px; text-transform: uppercase; letter-spacing: .08em;
  }
  #walls.off { display: none; }

  footer {
    border-top: 1px solid var(--line); padding: 12px 20px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover { border-color: #444458; }
  button.primary { background: var(--magenta); border-color: var(--magenta); color: #fff; font-weight: 600; }
  label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; cursor: pointer; }
  input[type=range] { flex: 1; min-width: 260px; accent-color: var(--magenta); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 108px; }
  .phases { display: flex; gap: 2px; width: 100%; font-size: 11px; }
  .phases button {
    flex: 1; padding: 5px 4px; border-radius: 0; background: #101017;
    color: var(--dim); font-size: 11px; letter-spacing: .03em;
  }
  .phases button:first-child { border-radius: 4px 0 0 4px; }
  .phases button:last-child { border-radius: 0 4px 4px 0; }
  .phases button:hover { color: var(--text); }
  .fps { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header>
  <h1>Vector Institute — “Convergence”</h1>
  <span class="meta">
    <b>6878 × 1080</b> · 3-wall immersive · <b>180 s</b> seamless loop ·
    magenta → violet → cobalt primary gradient
  </span>
</header>

<div id="stage">
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="walls" class="off"></div>
  </div>
</div>

<footer>
  <div class="row">
    <button id="play" class="primary">Pause</button>
    <span class="time" id="time">0:00.0 / 3:00.0</span>
    <input type="range" id="scrub" min="0" max="180" step="0.05" value="0">
    <span class="fps" id="fps"></span>
  </div>
  <div class="row">
    <label><input type="checkbox" id="overlay"> Venue overlay (walls, corners, grills, cube line, drapes)</label>
    <label><input type="checkbox" id="labels"> Wall labels</label>
    <label><input type="checkbox" id="bloom" checked> Bloom</label>
    <label><input type="checkbox" id="loopmark"> Show loop seam test (t = 179.5 → 0.5)</label>
    <label>Preview resolution
      <select id="quality">
        <option value="0.25" selected>1719 × 270 (fastest)</option>
        <option value="0.5">3439 × 540</option>
        <option value="0.75">5159 × 810</option>
        <option value="1">6878 × 1080 (full, slow)</option>
      </select>
    </label>
  </div>
  <div class="phases">
    <button data-t="0">0:00 · Distant</button>
    <button data-t="40">0:40 · Advance</button>
    <button data-t="84">1:24 · Converge</button>
    <button data-t="116">1:56 · Ascend + icon</button>
    <button data-t="150">2:30 · Disperse</button>
    <button data-t="178">2:58 · Loop point</button>
  </div>
</footer>

<script>
(() => {
  // src/brand.js
  var GRADIENT = [
    { t: 0, base: [235, 8, 138], glow: [253, 9, 124] },
    // magenta
    { t: 0.42, base: [235, 8, 138], glow: [254, 6, 135] },
    // magenta hold
    { t: 0.5, base: [138, 37, 201], glow: [164, 40, 242] },
    // violet transition
    { t: 0.58, base: [49, 60, 255], glow: [24, 58, 251] },
    // cobalt
    { t: 1, base: [49, 60, 255], glow: [0, 112, 255] }
    // cobalt hold
  ];
  var clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  function gradientAt(u, emissive = 0) {
    const t2 = clamp01(u);
    let a = GRADIENT[0];
    let b = GRADIENT[GRADIENT.length - 1];
    for (let i = 0; i < GRADIENT.length - 1; i++) {
      if (t2 >= GRADIENT[i].t && t2 <= GRADIENT[i + 1].t) {
        a = GRADIENT[i];
        b = GRADIENT[i + 1];
        break;
      }
    }
    const span = b.t - a.t;
    const k = span <= 0 ? 0 : (t2 - a.t) / span;
    const out = [0, 0, 0];
    for (let i = 0; i < 3; i++) {
      const base = a.base[i] + (b.base[i] - a.base[i]) * k;
      const glow = a.glow[i] + (b.glow[i] - a.glow[i]) * k;
      out[i] = Math.round(base + (glow - base) * clamp01(emissive));

  }
  function rgba([r, g, b], alpha) {
    return `rgba(${r},${g},${b},${alpha.toFixed(4)})`;
  }
  var CANVAS_W = 6878;
  var CANVAS_H = 1080;
  var VENUE = {
    width: CANVAS_W,
    height: CANVAS_H,
    // The three projected wall surfaces, in canvas order.
    walls: [
      { id: "south", label: "South Wall", x0: 0, x1: 2239 },
      { id: "west", label: "West Wall", x0: 2596, x1: 4277 },
      { id: "north", label: "North Wall", x0: 4634, x1: 6878 }
    ],
    // Physical corner returns between the walls. Content crossing these is
    // wrapping around a real corner, so nothing load-bearing should land here.
    corners: [
      { label: "West-faced corner", x0: 2239, x1: 2501 },
      { label: "South-faced corner", x0: 2501, x1: 2596 },
      { label: "South-faced corner", x0: 4277, x1: 4371 },
      { label: "West-faced corner", x0: 4371, x1: 4634 }
    ],
    // Horizontal break where the side walls meet the physical cube structure.
    cubeTop: 674,
    // Below this line the template is marked "background graphics only, no text".
    noTextBelow: 538,
    // Speaker grills — physical perforated panels; artwork behind them reads as
    // texture at best, so hero elements should not be centred here.
    grills: [
      { label: "South Grill", x0: 430, x1: 1376, y0: 358, y1: 488 },
      { label: "North Grill", x0: 5481, x1: 6426, y0: 358, y1: 488 }
    ],
    // Draped fabric flanking each cube — soft, non-flat surfaces.
    drapes: [
      { label: "A", x0: 0, x1: 301, y0: 674, y1: 1080 },
      { label: "B", x0: 2031, x1: 2239, y0: 674, y1: 1080 },
      { label: "C", x0: 4634, x1: 4845, y0: 674, y1: 1080 },
      { label: "D", x0: 6575, x1: 6878, y0: 674, y1: 1080 }
    ],
    // Central LED/projection screen on the west wall.
    domino: { x0: 2633, x1: 4243, y0: 0, y1: 628 }
  };
  var WEST_CENTRE = (VENUE.walls[1].x0 + VENUE.walls[1].x1) / 2;
  var ARROW_REGULAR = {
    w: 422.98,
    h: 600,
    d: "M308.51,0 L46.97,114.42 L0,224.04 L208.02,137.79 L68.91,480.94 L67.58,484.26 L113.86,600 L286.24,169.06 L376.67,375.07 L422.98,267.08 Z"
  };
  var ARROW_LONG = {
    w: 537.23,
    h: 1080,
    d: "M463.33,0l-168.9,73.89-29.33,69.19,133.39-53.47L0,1079.82l62.23.18L448.81,109.21l59.1,131.81,29.33-69.78L463.33,0Z"
  };
  var LOGO_ICON = {
    x0: 721.58,
    y0: 48.16,
    x1: 2369.3,
    y1: 1893.09,
    parts: [
      {
        fill: "#ffffff",
        d: "M1649.64,1408.87 L1232.78,314.36 L1440.01,314.36 L1440.01,177.41 L721.58,177.41 L721.58,314.36 L929.23,314.36 L1472.62,1737.49 L1538.97,1893.09 L1685.91,1499.05 Z"
      },
      {
        fill: "#ed2c8a",
        d: "M2194.88,48.16 L1796.37,222.5 L1724.81,389.53 L2041.77,258.1 L1829.8,780.97 L1827.78,786.02 L1898.29,962.38 L2160.95,305.76 L2298.75,619.65 L2369.3,455.1 Z"
      }
    ]
  };
  var PLUS_BAR_RATIO = 14.99 / 72.85;

  // src/scene.js
  var DURATION = 180;
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a = a + 1831565813 >>> 0;
      let x = Math.imul(a ^ a >>> 15, 1 | a);
      x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
      return ((x ^ x >>> 14) >>> 0) / 4294967296;
    };
  }
  var clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  var clamp012 = (v) => clamp(v, 0, 1);
  var smoothstep = (x) => {
    const t2 = clamp012(x);
    return t2 * t2 * (3 - 2 * t2);
  };
  var lerp = (a, b, k) => a + (b - a) * k;
  function curve(stops) {
    return function(t2) {
      if (t2 <= stops[0][0]) return stops[0][1];
      const last2 = stops[stops.length - 1];
      if (t2 >= last2[0]) return last2[1];
      for (let i = 0; i < stops.length - 1; i++) {
        const [ta, va] = stops[i];
        const [tb, vb] = stops[i + 1];
        if (t2 >= ta && t2 <= tb) {
          return lerp(va, vb, smoothstep((t2 - ta) / (tb - ta)));
        }
      }
      return last2[1];
    };
  }
  var reachAt = curve([
    [0, 0.13],
    [30, 0.16],
    [58, 0.33],
    [80, 0.52],
    [100, 0.56],
    [118, 0.575],
    [140, 0.4],
    [165, 0.175],
    [180, 0.13]
  ]);
  var intensityAt = curve([
    [0, 0.55],
    [28, 0.62],
    [60, 0.86],
    [84, 1],
    [112, 1],
    [134, 0.92],
    [160, 0.66],
    [180, 0.55]
  ]);
  var streakAt = curve([
    [0, 0],
    [28, 0.12],
    [46, 1],
    [62, 0.62],
    [80, 0.12],
    [100, 0],
    [180, 0]
  ]);
  var ascendAt = curve([
    [0, 0],
    [98, 0],
    [116, 1],
    [132, 0.62],
    [152, 0.16],
    [180, 0]
  ]);
  var logoAt = curve([
    [0, 0],
    [101, 0],
    [112, 1],
    [125, 1],
    [135, 0],
    [180, 0]
  ]);
  var spreadAt = curve([
    [0, 0.62],
    [60, 0.78],
    [100, 0.94],
    [130, 0.86],
    [180, 0.62]
  ]);
  var speedAt = curve([
    [0, 0.55],
    [30, 0.75],
    [50, 1.35],
    [70, 1.05],
    [100, 0.85],
    [120, 1],
    [150, 0.7],
    [180, 0.55]
  ]);
  var FLOW_LUT = (() => {
    const N = 3600;
    const lut = new Float64Array(N + 1);
    let acc = 0;
    const dt = DURATION / N;
    for (let i = 1; i <= N; i++) {
      const a = speedAt((i - 1) * dt);
      const b = speedAt(i * dt);
      acc += (a + b) / 2 * dt;
      lut[i] = acc;
    }
    const total = lut[N];
    for (let i = 0; i <= N; i++) lut[i] /= total;
    return lut;
  })();
  function flowPhase(t2) {
    const N = FLOW_LUT.length - 1;
    const x = clamp012(t2 / DURATION) * N;
    const i = Math.min(N - 1, Math.floor(x));
    return lerp(FLOW_LUT[i], FLOW_LUT[i + 1], x - i);
  }
  function bandCentre(xn, t2, ascend) {
    const loop = t2 / DURATION * Math.PI * 2;
    const sag = 0.105 * Math.sin(Math.PI * xn);
    const drift = 0.022 * Math.sin(loop + xn * 3.4) + 0.014 * Math.sin(loop * 2 + xn * 7.1);
    return CANVAS_H * (0.47 + sag + drift - 0.1 * ascend);
  }
  function bandSpread(xn, t2, spread, converge) {
    const edgeBias = 0.34 + 0.66 * Math.pow(Math.abs(2 * xn - 1), 1.3);
    const shape = lerp(edgeBias, 0.92, converge * 0.75);
    return CANVAS_H * 0.5 * spread * shape;
  }
  var LOGO_CX = WEST_CENTRE;
  var LOGO_CY = CANVAS_H * 0.4;
  function logoClearance(x, y, logoAlpha) {
    if (logoAlpha < 0.01) return 1;
    const rx = CANVAS_H * 0.62;
    const ry = CANVAS_H * 0.46;
    const d = Math.hypot((x - LOGO_CX) / rx, (y - LOGO_CY) / ry);
    const clear = 0.08 + 0.92 * smoothstep((d - 0.5) / 0.55);
    return lerp(1, clear, logoAlpha);
  }
  function envelope(xn, reach) {
    const falloff = (s) => {
      if (s <= 0.6) return 1;
      const k = (s - 0.6) / 0.9;
      return Math.exp(-k * k * 2.6);
    };
    const eL = falloff(xn / reach);
    const eR = falloff((1 - xn) / reach);
    return Math.min(1.25, eL + eR);
  }
  var LAPS = [2, 3, 4, 5, 6, 8];
  function buildParticles(seed, count) {
    const rnd = mulberry32(seed);
    const out = [];
    for (let i = 0; i < count; i++) {
      const depth = Math.pow(rnd(), 1.9);
      const l = rnd() + rnd() + rnd();
      const lane = l / 3 * 2 - 1;
      out.push({
        u0: rnd(),
        lane,
        depth,
        laps: LAPS[Math.min(LAPS.length - 1, Math.floor(depth * LAPS.length + rnd() * 0.9))],
        kind: rnd() < 0.55 ? 0 : 1,
        // 0 = pixel, 1 = plus
        // Pixels in the official pattern sit on-grid; a small rotation on a
        // minority of marks reads as motion without breaking the pattern.
        rot: rnd() < 0.22 ? (rnd() - 0.5) * 0.5 : 0,
        twPhase: rnd() * Math.PI * 2,
        twRate: 1 + Math.floor(rnd() * 4),
        twAmt: 0.15 + rnd() * 0.4,
        jitter: rnd() * Math.PI * 2,
        sizeVar: 0.75 + rnd() * 0.55

  }
  function buildArrows(seed, count, minH, maxH, longChance) {
    const rnd = mulberry32(seed);
    const out = [];
    for (let i = 0; i < count; i++) {
      const depth = Math.pow(rnd(), 1.35);
      const l = rnd() + rnd();
      out.push({
        u0: rnd(),
        lane: l / 2 * 2 - 1,
        depth,
        laps: LAPS[Math.min(LAPS.length - 1, Math.floor(depth * LAPS.length + rnd() * 0.9))],
        // Size tracks depth. Decoupling them produces large, dim arrows that
        // read as flat washes rather than as objects sitting further back.
        h: lerp(minH, maxH, clamp012(depth * 0.78 + rnd() * 0.3)),
        long: rnd() < longChance,
        twPhase: rnd() * Math.PI * 2,
        twRate: 1 + Math.floor(rnd() * 3),
        alphaVar: 0.6 + rnd() * 0.5,
        jitter: rnd() * Math.PI * 2

    }
    return out;
  }
  function createScene() {
    const P2D = globalThis.Path2D;
    if (!P2D) throw new Error("Path2D is required (set globalThis.Path2D in Node).");

      arrowRegular: new P2D(ARROW_REGULAR.d),
      arrowLong: new P2D(ARROW_LONG.d),
      logo: LOGO_ICON.parts.map((p) => ({ fill: p.fill, path: new P2D(p.d) }))
    };
    const particles = buildParticles(24263, 4200);
    const arrowsFar = buildArrows(41246, 58, 0.03, 0.1, 0);
    const arrowsMid = buildArrows(45615, 30, 0.11, 0.26, 0.1);
    const arrowsHero = buildArrows(49978, 10, 0.3, 0.66, 0.3);
    const arrowsLong = buildArrows(54347, 6, 0.55, 0.98, 1);
    return { paths, particles, arrowsFar, arrowsMid, arrowsHero, arrowsLong };
  }
  function place(el, phase, t2, ascend, spread, converge) {
    let u = (el.u0 + el.laps * phase) % 1;
    const x = (u * 1.24 - 0.12) * CANVAS_W;
    const xn = clamp012(x / CANVAS_W);
    const centre = bandCentre(xn, t2, ascend);
    const half = bandSpread(xn, t2, spread, converge);
    const rise = -CANVAS_H * 0.05 * (u - 0.5) * (0.5 + el.depth);
    const wobble = Math.sin(el.jitter + t2 * 0.35 + u * 6) * CANVAS_H * 0.012;

  }
  function drawScene(ctx2, time, scene2) {
    const t2 = (time % DURATION + DURATION) % DURATION;
    const reach = reachAt(t2);
    const intensity = intensityAt(t2);
    const streak = streakAt(t2);
    const ascend = ascendAt(t2);
    const spread = spreadAt(t2);
    const logoAlpha = logoAt(t2);
    const phase = flowPhase(t2);
    const converge = smoothstep((reach - 0.3) / 0.26);
    drawBackground(ctx2, t2, reach, intensity, converge);
    ctx2.save();
    ctx2.globalCompositeOperation = "lighter";
    drawArrowLayer(ctx2, scene2, scene2.arrowsFar, t2, phase, ascend, spread, converge, reach, intensity, 0.5, logoAlpha);
    drawParticles(ctx2, scene2, t2, phase, ascend, spread, converge, reach, intensity, streak, logoAlpha);
    drawArrowLayer(ctx2, scene2, scene2.arrowsMid, t2, phase, ascend, spread, converge, reach, intensity, 0.6, logoAlpha);
    drawArrowLayer(ctx2, scene2, scene2.arrowsLong, t2, phase, ascend, spread, converge, reach, intensity, 0.5, logoAlpha);

  function drawBackground(ctx2, t2, reach, intensity, converge) {
    const g = ctx2.createLinearGradient(0, 0, CANVAS_W, 0);
    g.addColorStop(0, "#0d0010");
    g.addColorStop(0.35, "#080011");
    g.addColorStop(0.5, "#070113");
    g.addColorStop(0.72, "#040314");

      { cx: WEST_CENTRE, col: gradientAt(0.5, 0.8), a: 0.11 * converge * intensity, r: CANVAS_W * 0.13 }
    ];
    for (const w of washes) {
      if (w.a <= 2e-3) continue;
      const rg = ctx2.createRadialGradient(w.cx, CANVAS_H * 0.5, 0, w.cx, CANVAS_H * 0.5, w.r);
      rg.addColorStop(0, rgba(w.col, w.a));
      rg.addColorStop(0.55, rgba(w.col, w.a * 0.28));
      rg.addColorStop(1, rgba(w.col, 0));
      ctx2.fillStyle = rg;
      ctx2.fillRect(w.cx - w.r, 0, w.r * 2, CANVAS_H);
    }
    ctx2.restore();
  }
  function drawParticles(ctx2, scene2, t2, phase, ascend, spread, converge, reach, intensity, streak, logoAlpha) {
    const bar = PLUS_BAR_RATIO;
    for (const p of scene2.particles) {
      const pos = place(p, phase, t2, ascend, spread, converge);
      if (pos.x < -140 || pos.x > CANVAS_W + 140) continue;
      const env = envelope(pos.xn, reach);
      if (env < 0.012) continue;
      const tw = 1 - p.twAmt + p.twAmt * (0.5 + 0.5 * Math.sin(p.twPhase + t2 / DURATION * Math.PI * 2 * p.twRate * 3));
      let alpha = (0.1 + 0.62 * Math.pow(p.depth, 1.25)) * env * intensity * tw;
      alpha *= 1 + 0.35 * ascend * p.depth;
      alpha *= logoClearance(pos.x, pos.y, logoAlpha);
      if (alpha < 6e-3) continue;
      const emissive = clamp012(0.25 + p.depth * 0.75);
      const col = gradientAt(pos.xn, emissive);
      let size = CANVAS_H * (55e-4 + 0.05 * Math.pow(p.depth, 2.1)) * p.sizeVar;
      size *= 1 + 0.22 * ascend * p.depth;
      if (streak > 0.02 && p.depth > 0.3) {
        const len = size * (1.5 + 16 * streak * (p.laps / 8));
        const th = Math.max(1, size * (p.kind === 0 ? 0.3 : 0.22));
        ctx2.fillStyle = rgba(col, alpha * 0.2 * streak);
        ctx2.fillRect(pos.x - len, pos.y - th / 2, len, th);
      }
      ctx2.fillStyle = rgba(col, alpha);
      if (p.rot !== 0) {
        ctx2.save();
        ctx2.translate(pos.x, pos.y);
        ctx2.rotate(p.rot);
        if (p.kind === 0) ctx2.fillRect(-size / 2, -size / 2, size, size);
        else fillPlus(ctx2, 0, 0, size, bar);
        ctx2.restore();
      } else if (p.kind === 0) {
        ctx2.fillRect(pos.x - size / 2, pos.y - size / 2, size, size);
      } else {
        fillPlus(ctx2, pos.x, pos.y, size, bar);
      }
    }
  }
  function fillPlus(ctx2, cx, cy, size, bar) {
    const h = size / 2;
    const b = size * bar / 2;
    ctx2.fillRect(cx - h, cy - b, size, b * 2);
    ctx2.fillRect(cx - b, cy - h, b * 2, size);
  }
  function drawArrowLayer(ctx2, scene2, arrows, t2, phase, ascend, spread, converge, reach, intensity, weight, logoAlpha) {
    for (const a of arrows) {
      const pos = place(a, phase, t2, ascend, spread, converge);
      const src = a.long ? ARROW_LONG : ARROW_REGULAR;
      const h = CANVAS_H * a.h * (1 + 0.14 * ascend * a.depth);
      const w = h / src.h * src.w;
      if (pos.x < -w - 80 || pos.x > CANVAS_W + w + 80) continue;
      const env = envelope(pos.xn, reach);
      if (env < 0.012) continue;
      const tw = 0.72 + 0.28 * Math.sin(a.twPhase + t2 / DURATION * Math.PI * 2 * a.twRate * 2);
      let alpha = weight * (0.22 + 0.78 * a.depth) * env * intensity * tw * a.alphaVar;
      alpha *= 1 + 0.3 * ascend * a.depth;
      if (alpha < 6e-3) continue;
      const centreY = bandCentre(pos.xn, t2, ascend);
      const room = Math.max(CANVAS_H * 0.05, (CANVAS_H - h) / 2);
      const y = centreY + clamp(pos.y - centreY, -room, room);
      alpha *= logoClearance(pos.x, y, logoAlpha);
      if (alpha < 6e-3) continue;
      const col = gradientAt(pos.xn, clamp012(0.3 + a.depth * 0.7));
      const tail = gradientAt(pos.xn, clamp012(0.1 + a.depth * 0.4));
      ctx2.save();
      ctx2.translate(pos.x - w / 2, y - h / 2);
      ctx2.scale(h / src.h, h / src.h);
      const grad = ctx2.createLinearGradient(0, src.h, src.w, 0);
      grad.addColorStop(0, rgba(tail, Math.min(alpha, 0.95) * 0.5));
      grad.addColorStop(1, rgba(col, Math.min(alpha, 0.95)));
      ctx2.fillStyle = grad;
      ctx2.fill(a.long ? scene2.paths.arrowLong : scene2.paths.arrowRegular);
      ctx2.restore();
    }
  }
  function drawLogo(ctx2, scene2, alpha, t2) {
    const src = LOGO_ICON;
    const iw = src.x1 - src.x0;
    const ih = src.y1 - src.y0;
    const h = CANVAS_H * 0.54;
    const s = h / ih;
    const cx = LOGO_CX;
    const cy = LOGO_CY;
    const settle = 1 + 0.06 * (1 - alpha);
    ctx2.save();
    ctx2.translate(cx, cy);
    ctx2.scale(s * settle, s * settle);
    ctx2.translate(-src.x0 - iw / 2, -src.y0 - ih / 2);
    ctx2.globalAlpha = alpha;
    for (const part of scene2.paths.logo) {
      ctx2.fillStyle = part.fill;
      ctx2.fill(part.path);
    }
    ctx2.restore();
  }
  function applyBloom(ctx2, makeCanvas2, cache, strength = 0.55) {
    const src = ctx2.canvas;
    const W = src.width;
    const H = src.height;
    if (!cache.a || cache.w !== W) {
      cache.a = makeCanvas2(Math.max(1, Math.round(W / 5)), Math.max(1, Math.round(H / 5)));
      cache.b = makeCanvas2(Math.max(1, Math.round(W / 22)), Math.max(1, Math.round(H / 22)));
      cache.w = W;
    }
    const a = cache.a;
    const b = cache.b;
    const ca = a.getContext("2d");
    const cb = b.getContext("2d");
    ca.globalCompositeOperation = "copy";
    ca.globalAlpha = 1;
    ca.drawImage(src, 0, 0, a.width, a.height);
    cb.globalCompositeOperation = "copy";
    cb.drawImage(a, 0, 0, b.width, b.height);
    ca.globalCompositeOperation = "lighter";
    ca.globalAlpha = 0.4;
    ca.drawImage(b, 0, 0, a.width, a.height);
    ca.globalAlpha = 1;
    ctx2.save();
    ctx2.setTransform(1, 0, 0, 1, 0, 0);
    ctx2.globalCompositeOperation = "lighter";
    ctx2.globalAlpha = strength;
    ctx2.drawImage(a, 0, 0, W, H);
    ctx2.restore();
  }
  function drawVenueOverlay(ctx2) {
    ctx2.save();
    ctx2.lineWidth = 3;
    ctx2.font = "600 30px system-ui, sans-serif";
    ctx2.textBaseline = "top";
    for (const c of VENUE.corners) {
      ctx2.fillStyle = "rgba(255,255,255,0.10)";
      ctx2.fillRect(c.x0, 0, c.x1 - c.x0, CANVAS_H);
    }
    for (const w of VENUE.walls) {
      ctx2.strokeStyle = "rgba(255,255,255,0.85)";
      ctx2.strokeRect(w.x0 + 1.5, 1.5, w.x1 - w.x0 - 3, CANVAS_H - 3);
    }
    ctx2.setLineDash([14, 10]);
    ctx2.strokeStyle = "rgba(80,220,255,0.85)";
    for (const w of [VENUE.walls[0], VENUE.walls[2]]) {
      ctx2.beginPath();
      ctx2.moveTo(w.x0, VENUE.cubeTop);
      ctx2.lineTo(w.x1, VENUE.cubeTop);
      ctx2.stroke();
    }
    ctx2.strokeStyle = "rgba(255,120,120,0.9)";
    ctx2.fillStyle = "rgba(255,120,120,0.10)";
    for (const g of VENUE.grills) {
      ctx2.fillRect(g.x0, g.y0, g.x1 - g.x0, g.y1 - g.y0);
      ctx2.strokeRect(g.x0, g.y0, g.x1 - g.x0, g.y1 - g.y0);
    }
    ctx2.strokeStyle = "rgba(255,210,90,0.85)";
    ctx2.fillStyle = "rgba(255,210,90,0.10)";
    for (const d of VENUE.drapes) {
      ctx2.fillRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
      ctx2.strokeRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
    }
    ctx2.setLineDash([]);
    ctx2.strokeStyle = "rgba(140,255,180,0.8)";
    const dm = VENUE.domino;
    ctx2.strokeRect(dm.x0, dm.y0 + 1.5, dm.x1 - dm.x0, dm.y1 - dm.y0);
    ctx2.restore();
  }

  // src/preview-main.js
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var quality = 0.25;
  function resize() {
    canvas.width = Math.round(CANVAS_W * quality);
    canvas.height = Math.round(CANVAS_H * quality);
  }
  resize();
  var scene = createScene();
  var bloomCache = {};
  var makeCanvas = (w, h) => {
    const el = document.createElement("canvas");
    el.width = w;
    el.height = h;
    return el;
  };
  var wallsEl = document.getElementById("walls");
  for (const w of VENUE.walls) {
    const d = document.createElement("div");
    d.style.left = w.x0 / CANVAS_W * 100 + "%";
    d.style.width = (w.x1 - w.x0) / CANVAS_W * 100 + "%";
    d.textContent = `${w.label} \xB7 ${w.x1 - w.x0}\xD7${CANVAS_H}`;
    wallsEl.appendChild(d);
  }
  var t = 0;
  var playing = true;
  var last = performance.now();
  var frames = 0;
  var fpsAcc = 0;
  var playBtn = document.getElementById("play");
  var scrub = document.getElementById("scrub");
  var timeEl = document.getElementById("time");
  var fpsEl = document.getElementById("fps");
  var overlayEl = document.getElementById("overlay");
  var labelsEl = document.getElementById("labels");
  var bloomEl = document.getElementById("bloom");
  var loopmarkEl = document.getElementById("loopmark");
  playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    last = performance.now();
  };
  scrub.oninput = () => {
    t = Number(scrub.value);
    if (!playing) render();
  };
  labelsEl.onchange = () => wallsEl.classList.toggle("off", !labelsEl.checked);
  for (const b of document.querySelectorAll(".phases button")) {
    b.onclick = () => {
      t = Number(b.dataset.t);
      scrub.value = t;
      if (!playing) render();
    };
  }
  var seamDir = 0;
  loopmarkEl.onchange = () => {
    seamDir = loopmarkEl.checked ? 1 : 0;
    if (seamDir) t = 179.5;
  };
  function fmt(s) {
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    return `${m}:${r.toFixed(1).padStart(4, "0")}`;
  }
  function render() {
    ctx.setTransform(quality, 0, 0, quality, 0, 0);
    drawScene(ctx, t, scene);
    if (bloomEl.checked) applyBloom(ctx, makeCanvas, bloomCache);
    ctx.setTransform(quality, 0, 0, quality, 0, 0);
    if (overlayEl.checked) drawVenueOverlay(ctx);
    timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  }
  document.getElementById("quality").onchange = (e) => {
    quality = Number(e.target.value);
    resize();
    bloomCache.a = null;
    if (!playing) render();
  };
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1e3);
    last = now;
    if (playing) {
      t += dt;
      if (seamDir) {
        if (t > 180.5) t = 179.5;
      } else if (t >= DURATION) {
        t -= DURATION;
      }
      scrub.value = Math.min(180, t);
    }
    render();
    frames++;
    fpsAcc += dt;
    if (fpsAcc > 0.5) {
      fpsEl.textContent = `${(frames / fpsAcc).toFixed(0)} fps preview`;
      frames = 0;
      fpsAcc = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
